<title>LabService srls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first single column (Figma 390pt) — green app bar, full-bleed white lists, 5-slot bottom nav; ≥980px the side menu docks left */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#EFF3F0; --fg:#17201A; --muted:#5B685F; --line:#D3DBD5;
  --brand:#2E7D32; --brand-ink:#FFFFFF; --brand-soft:#D6E8D7; --brand-deep:#1F5A24;
  --bar:#3E8957; --bar-ink:#FFFFFF; --idle:#9799C8; --rowline:#9DBFE0;
  --ok:#2E7D32; --ok-soft:#DCEEDD; --warn:#A86200; --warn-soft:#FCEBCB; --bad:#C62828; --bad-soft:#FADDDD; --info:#1E6AAE; --info-soft:#DCEAF7;
  --paper:#FFFFFF; --ink:#111111;
  --shadow:0 2px 6px rgb(23 60 30 / .22);
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
body.is-login::before{background:var(--bg)}
body.locked{overflow:hidden}
p,h1,h2,h3,figure{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.blk{padding-block:18px 6px}

/* shell */
.app{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;background:var(--bg)}
main{flex:1;padding-bottom:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:4px;min-height:56px;background:var(--bar);color:var(--bar-ink);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top>.icbtn:first-child{margin-left:-8px}
.top h1{flex:1;min-width:0;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.icbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:10px;color:inherit;flex:none}
.icbtn:disabled{opacity:.3;cursor:default}
.dot{position:absolute;top:3px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#FFFFFF;font-size:11px;font-weight:700;display:grid;place-items:center;border:1.5px solid var(--bar)}
.avatar{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);color:var(--brand-deep);font-weight:700;font-size:12px;margin-left:4px;flex:none}
.dock{position:sticky;bottom:0;z-index:20}
.bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -2px 14px rgb(0 0 0 / .08);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--idle);font-size:12px;padding:2px 0;min-width:0}
.bnav button>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
.bnav .on{color:var(--brand);font-weight:600}
.bnav .on .ico{background:var(--brand-soft)}
.bnav .home .ico{width:56px;height:56px;margin-top:-30px;background:var(--brand-soft);border:4px solid var(--surface);color:var(--idle)}
.bnav .home.on .ico{background:var(--brand);color:var(--brand-ink)}
.footbar{display:flex;gap:10px;padding-block:10px;background:var(--bg);border-top:1px solid var(--line);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.grow{flex:1}

/* drawer */
.drawer{position:fixed;inset:0 auto 0 0;width:min(333px,86vw);background:var(--surface);z-index:50;transform:translateX(-105%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);box-shadow:6px 0 30px rgb(0 0 0 / .2)}
.drawer.open{transform:none}
.d-head{background:var(--brand-soft);padding:18px 16px 14px;border-bottom:1px solid var(--brand);display:grid;grid-template-columns:64px minmax(0,1fr);gap:2px 14px;align-items:center}
.d-av{width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:20px;grid-row:span 2}
.d-head strong{font-size:18px;line-height:1.2}
.d-head .addr{grid-column:1/-1;font-size:13px;margin-top:8px;color:var(--muted)}
.d-items{padding:14px 12px 14px 0;flex:1;display:flex;flex-direction:column}
.d-item{display:flex;align-items:center;gap:14px;padding:11px 16px;border:0;background:none;border-bottom:1px solid var(--brand-soft);text-align:left;font-size:16px;color:var(--fg);border-radius:0 12px 12px 0}
.d-item.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.d-foot{background:var(--brand-soft);border-top:1px solid var(--brand);padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.d-foot .logo{text-align:left;font-size:26px}
.d-foot .ci{display:flex;align-items:center;gap:10px;user-select:all}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:40}

/* type + home */
.logo{font-size:30px;font-weight:700;letter-spacing:-.01em;text-align:center;color:var(--fg)}
.logo b{color:var(--brand);font-weight:700}
.logo small{font-size:.5em;font-weight:600;letter-spacing:.03em;color:var(--muted);margin-left:1px}
.hero{padding-block:24px 8px}
.hello{font-size:19px}
.h2{font-size:19px;font-weight:600}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--info-soft);color:var(--info);border:1px solid var(--info);flex:none}
.hic.g{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
.sec-h h3{font-size:17px;font-weight:600}
.link{background:none;border:0;color:var(--brand-deep);font-weight:500;padding:6px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--r);border:0;background:var(--brand);color:var(--brand-ink);font-size:16px;font-weight:500;box-shadow:var(--shadow);text-align:center;line-height:1.2;transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.btn.sec{background:var(--surface);color:var(--brand-deep);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.danger{background:var(--bad);color:#FFFFFF}
.btn.block{width:100%}
.btn.sm{min-height:34px;font-size:14px;padding:4px 12px;box-shadow:none;border-radius:9px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.dng{background:var(--bad-soft);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.span2{grid-column:1/-1}
.withchk{display:flex;gap:10px;align-items:center}
.withchk .btn{flex:1}
.chk{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid var(--brand);background:var(--brand-soft);color:var(--brand-deep);box-shadow:var(--shadow)}
.chk.half{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chk.full{background:var(--brand);color:var(--brand-ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* notifications */
.nbox{background:var(--surface-2);padding:5px;border-radius:4px;display:flex;flex-direction:column;gap:5px}
.notif{display:flex;gap:10px;align-items:center;width:100%;background:var(--surface);border:0;border-bottom:2px solid var(--brand);padding:8px 10px;text-align:left;border-radius:2px;color:var(--fg)}
.ncirc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid currentColor}
.ncirc.bad{background:var(--bad-soft);color:var(--bad)}
.ncirc.warn{background:var(--warn-soft);color:var(--warn)}
.ncirc.info{background:var(--info-soft);color:var(--info)}
.ncirc.ok{background:var(--ok-soft);color:var(--ok)}
.ntx{display:flex;flex-direction:column;min-width:0}
.ntx strong{font-size:15px}
.ntx span{font-size:13px;color:var(--muted)}

/* tags, chips, kv */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.5}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip.al{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);font-weight:600}
.kv{display:flex;gap:6px;font-size:14px;flex-wrap:wrap}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{overflow-wrap:anywhere}
.sel-text{user-select:all}

/* lists */
.list{background:var(--surface);border-top:1px solid var(--line)}
.row{display:block;background:var(--surface);border-bottom:1px solid var(--rowline)}
.row>summary{list-style:none;display:flex;align-items:center;gap:10px;padding-block:10px;cursor:pointer}
.row>summary::-webkit-details-marker{display:none}
.rh{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chev{flex:none;color:var(--muted);transition:transform .2s}
.row[open] .chev{transform:rotate(180deg)}
.row-b{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.r-title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.r-sub{color:var(--muted);font-size:13px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.flat{display:flex;align-items:center;gap:10px;padding-block:10px}
.selrow{cursor:pointer}
.selrow input,.cbox input,.pchip input{accent-color:var(--brand)}
.selrow input{width:22px;height:22px;flex:none}
.ilist{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:2px 12px}
.ili{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ili:last-child{border-bottom:0}
.ili>span:first-child{min-width:0;overflow-wrap:anywhere}
.ili>span:last-child{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding-block:28px;text-align:center;color:var(--muted)}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* tools */
.tools{display:flex;gap:8px;align-items:center;padding-block:10px}
.search{position:relative;flex:1;min-width:0;display:block}
.search .in{height:40px;padding-right:38px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.tbtn{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.tbtn.pri{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
.mbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-top:1px solid var(--line);padding-block:2px}
.mbar strong{font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--fg);flex:none}
.tab.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tabs.fit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
.tabs.fit .tab{justify-content:center;padding:9px 4px;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tabn{font-size:12px;font-weight:600;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--line);color:var(--fg);text-align:center}
.tab.on .tabn{background:rgba(255,255,255,.25);color:inherit}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.fs legend{font-weight:500;font-size:15px}
.in{height:46px;width:100%;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:var(--surface);color:var(--fg)}
textarea.in{height:auto;min-height:88px;padding:10px 14px;resize:vertical}
select.in{padding-right:8px}
.in::placeholder{color:var(--muted);opacity:.8}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.in.err{border-color:var(--bad);outline-color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
.errmsg{font-size:14px;color:var(--bad);font-weight:500}
.fs{border:0;padding:0;margin:0;min-width:0}
.fs legend{padding:0;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.segopt{position:relative}
.segopt input{position:absolute;opacity:0;inset:0}
.segopt span{display:block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.segopt input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.segopt input:disabled+span{opacity:.45}
.segopt input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.pchip{position:relative}
.pchip input{position:absolute;opacity:0;inset:0}
.pchip span{display:block;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pchip input:checked+span{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.pchip input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.cbox{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer;min-width:0}
.cbox input{width:18px;height:18px;flex:none}
.cbox.nc{border-color:var(--bad);color:var(--bad)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.tin{display:flex;align-items:center;gap:8px}
.tin .in{flex:1;min-width:0}
.unit{color:var(--muted)}
.q-row{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.au-q.au-err{box-shadow:inset 3px 0 0 var(--bad);padding-left:10px}
.au-q.au-err strong{color:var(--bad)}
.row.rbtn{width:100%;border:0;border-bottom:1px solid var(--rowline);font:inherit;color:inherit;text-align:left;cursor:pointer}
.q-row:last-of-type{border-bottom:0}
.ranges{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.range{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.range:last-child{border-bottom:0}
.range strong{font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:var(--fg)}
.opt .oi{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;flex:none}
.opt strong{display:block}
.opt small{color:var(--muted);font-size:13px}

/* temperature table */
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tt th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt tr:last-child td{border-bottom:0}
.tv.ok{color:var(--ok)}
.tv.tol{color:var(--warn);font-weight:600}
.tv.bad{color:var(--bad);font-weight:700}
.tt tr.az td{white-space:normal;color:var(--bad);font-size:13px;padding-top:0}

/* audit */
.score{display:flex;align-items:center;gap:18px}
.ring{width:118px;height:118px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p) * 1%), var(--surface-2) 0)}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.ring span{font-size:12px;color:var(--muted)}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.meter b{font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rc);border-radius:inherit}
.lv-ok{--rc:var(--ok)} .lv-warn{--rc:var(--warn)} .lv-bad{--rc:var(--bad)}

/* printed label */
.plabel{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:14px;max-width:360px;width:100%;margin-inline:auto;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.plabel header{border-bottom:1.5px solid var(--ink);padding-bottom:7px;display:flex;flex-direction:column;gap:2px}
.plabel header strong{font-size:17px;letter-spacing:.03em}
.plabel header span{font-size:11px}
.plabel dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;margin:0}
.plabel dt{font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.plabel dd{margin:0;font-weight:700;font-family:var(--mono)}
.plabel footer{display:flex;flex-direction:column;align-items:center;gap:3px;border-top:1.5px solid var(--ink);padding-top:8px}
.bars{display:block;width:100%;height:38px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px,var(--ink) 12px 13px,transparent 13px 16px)}

/* photos */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0}
.thumb{margin:0}
.timg{border:0;padding:0;width:100%;height:100%;display:block;background:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#FFFFFF;display:grid;place-items:center}
.thumb figcaption{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.25;padding:3px 5px;background:rgb(0 0 0 / .55);color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-big{width:100%;max-height:60dvh;object-fit:contain;border-radius:12px;background:var(--surface-2)}
.strip{display:flex;flex-direction:column;gap:8px}

/* temperature verify */
.tcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.tcard.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.tcard.is-nc{border-color:var(--bad);background:var(--bad-soft)}
.tc-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tc-h span{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.cbox.ok{border-color:var(--ok)}
.cbox.big{padding:12px;font-size:15px;font-weight:600;border-color:var(--brand)}
.cbox.big input{width:22px;height:22px}
.mrow{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--rowline)}
.mrow>label{display:flex;align-items:flex-start;padding-top:13px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:4px;cursor:pointer}
.mrow>label input,.selall input{width:22px;height:22px;accent-color:var(--brand)}
.mrow>details{flex:1;min-width:0;border-bottom:0}
.mrow>details>summary{padding-left:8px}
.mrow>details>.row-b{padding-left:8px}
.selall{display:flex;align-items:center;gap:10px;cursor:pointer}
.dlbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-block:12px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}

/* print (standalone only) */
#print{display:none}
.pm{font-family:var(--font);color:var(--ink);background:var(--paper);max-width:170mm;margin:0 auto;padding:10mm 0;text-align:center;display:flex;flex-direction:column;gap:6mm}
.pm h1{font-size:28pt;font-weight:700;letter-spacing:.01em}
.pm .sub{font-size:11pt}
.pm .it{display:flex;flex-direction:column;gap:1mm;padding-bottom:4mm;border-bottom:.3mm solid var(--ink)}
.pm .it strong{font-size:15pt}
.pm .al{font-size:9.5pt;text-transform:uppercase;letter-spacing:.06em}
.pm .legal{font-size:9pt;text-align:left;border:.3mm solid var(--ink);padding:4mm}
@media print{
  @page{margin:12mm}
  body.printing{background:var(--paper)!important}
  body.printing::before{display:none}
  body.printing>*:not(#print){display:none!important}
  body.printing #print{display:block!important}
  body.printing .plabel{box-shadow:none;margin:0 auto}
}

/* file allegati, selettori compatti, profilo */
.sec-h.wrap{flex-wrap:wrap;row-gap:8px}
.psel{flex:none}
.in.sm{height:36px;padding:0 10px;font-size:14px;width:auto;max-width:100%}
.frow{align-items:center}
.fopen{display:inline-flex;align-items:center;gap:6px;min-width:0;text-align:left;border:0;background:none;color:var(--brand-deep);font-weight:500;padding:4px 0;cursor:pointer}
.fopen span{overflow-wrap:anywhere;text-decoration:underline;text-underline-offset:3px}
.factions{display:flex;align-items:center;gap:2px}
.icbtn.sm{width:34px;height:34px}
input.file{height:auto;padding:10px;font-size:14px}
.who{display:flex;align-items:center;gap:12px}
.blk + .blk{border-top:1px solid var(--surface-2)}
/* sheet + toast */
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;max-height:90dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;z-index:60;box-shadow:0 -10px 40px rgb(0 0 0 / .28);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease}
.sheet-h{display:flex;align-items:center;gap:8px;padding-block:14px 6px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;min-width:0;font-size:19px;font-weight:600;outline:none}
.sheet-b{overflow-y:auto;padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* login */
.login{max-width:440px;width:100%;margin:0 auto;padding-block:12vh 32px}
.login-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.login-row .btn{min-width:120px}

/* password visibile, consenso, badge home, avvisi letti, ricette e note etichetta */
.pwrap{position:relative;display:flex}
.pwrap .in{flex:1;min-width:0;padding-right:50px}
.pwrap .eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.consent input{flex:none;width:20px;height:20px;margin-top:1px;accent-color:var(--brand)}
.consent a{color:var(--brand-deep);font-weight:600}
.hb{display:flex;align-items:center;justify-content:center;gap:8px}
.hb .bdg{flex:none;min-width:34px;height:24px;padding:0 7px;border-radius:12px;background:var(--brand-ink);color:var(--brand-deep);font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.notif.read{opacity:.55;border-bottom-color:var(--line)}
.rc-card{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rc-card .h-row span{min-width:0}
.chipx{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:16px;background:var(--brand-soft);color:var(--brand-deep);font-size:13px}
.chipx button{border:0;background:none;color:inherit;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;cursor:pointer}

@media (orientation:landscape) and (max-height:500px){.sheet{max-height:96dvh}.login{padding-block:24px}}

.qsum{font-size:14px;line-height:1.45;background:var(--brand-soft);color:var(--brand-deep);border-radius:10px;padding:10px 12px;margin:0 16px 8px}
.qsum b{font-weight:700}
.mp-line{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ai-st{font-weight:600}
@media (min-width:980px){
  .shell{display:grid;grid-template-columns:300px minmax(0,680px);justify-content:center;column-gap:28px;align-items:start}
  body.is-login .shell{grid-template-columns:minmax(0,680px)}
  body.is-login .drawer{display:none}
  .drawer{position:sticky;top:0;height:100dvh;transform:none;width:auto;z-index:1;box-shadow:none;border-inline:1px solid var(--line)}
  .top [data-act="drawer"]{display:none}
  .top>.icbtn:first-child[data-act="back"]{margin-left:-8px}
  .app{max-width:none;margin:0;border-inline:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

  - costanti e configurazione ......... date, elenchi fissi (allergeni, tipi di attrezzatura...)

  - files: PDF, CSV, print ............ registri e documenti in PDF (jsPDF) e CSV
  - photos ............................ riduzione e preparazione delle foto
  - lettura fattura da foto ........... IA (server o anteprima), poi lettore di testo sul telefono (Tesseract)

  - lettura targhetta attrezzatura .... dati di frigoriferi e macchine dalla foto (per ora solo nell'anteprima)
  - actions / forms ................... ACT e FORMS: cosa succede a ogni tasto e a ogni invio

function codeFor(name,iso,list){
  const ini=String(name).replace(/[^A-Za-zÀ-ÿ ]/g,' ').split(/\s+/).filter(w=>w.length>2).slice(0,3).map(w=>w[0].toUpperCase()).join('')||'LT';
  const base=`${ini}-${iso.slice(8,10)}${iso.slice(5,7)}-`;
  const n=list.filter(l=>l.code&&l.code.startsWith(base)).length+1;
  return base+pad(n);
}

function notifs(){
  const n=[];
  const done=todaySlots().length;
  if(devices().length&&done<2)n.push({k:`temp-${TISO}-${done}`,lv:'warn',t:'Temperature da verificare',d:`Mancano ${2-done} verific${2-done===1?'a':'he'} su 2 di oggi`,go:'temperatura'});
  if(!sanToday())n.push({k:`san-${TISO}`,lv:'warn',t:'Sanificazione ordinaria',d:'Non ancora registrata oggi',go:'sanificazione'});
  const due=auditDue();const ad=daysTo(due);
  if(ad<0)n.push({k:`audit-${due}-x`,lv:'bad',t:'Audit interno scaduto',d:`Andava eseguito entro il ${fmt(due)} (ogni 2 mesi)`,go:'audit'});
  else if(ad<=7)n.push({k:`audit-${due}-w`,lv:'warn',t:'Audit interno da eseguire',d:`Entro il ${fmt(due)}, ${ad===0?'oggi':ad===1?'domani':'tra '+ad+' giorni'}`,go:'audit'});
  S.products.forEach(p=>{const d=daysTo(p.scad);if(d<0)n.push({k:`exp-${p.id}-${p.scad}-x`,lv:'bad',t:`${p.name} scaduto`,d:`Lotto ${p.lotto}, scaduto il ${fmt(p.scad)}`,go:'magazzino'});else if(d<=3)n.push({k:`exp-${p.id}-${p.scad}-w`,lv:'warn',t:`${p.name} in scadenza`,d:`Lotto ${p.lotto}, ${dueTxt(d)}`,go:'magazzino'})});
  S.fatture.filter(f=>f.status==='pending').forEach(f=>n.push({k:`fatt-${f.id}`,lv:'info',t:'Merce da controllare',d:`Fattura N° ${f.num} · ${fname(f.forn)}`,go:'merci'}));
  S.team.forEach(t=>{const d=daysTo(t.att);if(d<0)n.push({k:`att-${t.id}-${t.att}-x`,lv:'bad',t:'Attestato HACCP scaduto',d:`${t.name}, scaduto il ${fmt(t.att)}`,go:'team'});else if(d<=60)n.push({k:`att-${t.id}-${t.att}-w`,lv:'warn',t:'Attestato HACCP in scadenza',d:`${t.name}, ${dueTxt(d)}`,go:'team'})});
  S.straord.filter(s=>s.stato!=='Eseguita'&&daysTo(s.date)<=3).forEach(s=>n.push({k:`str-${s.id}-${s.date}`,lv:'info',t:'Sanificazione straordinaria',d:`Da eseguire il ${fmt(s.date)}`,go:'sanificazione'}));
  const low=S.products.filter(p=>p.qty<p.min).length;
  if(low)n.push({k:`low-${TISO}-${low}`,lv:'info',t:'Scorte basse',d:`${low} prodott${low===1?'o':'i'} sotto la soglia minima`,go:'scorte'});
  const o={bad:0,warn:1,info:2};
  return n.sort((a,b)=>o[a.lv]-o[b.lv]);
}

  const day=TODAY.getDate();const elapsed=Math.max(day-1+(sanToday()?1:0),1);
  const s=Math.min(100,Math.round(new Set(S.sanLog.filter(x=>ym(x.date)===curYM).map(x=>x.date)).size/elapsed*100));
  const fm=S.fatture.filter(f=>ym(f.date)===curYM);

  const fo=S.team.length?Math.round(S.team.filter(x=>daysTo(x.att)>=0).length/S.team.length*100):100;
  return [['Temperature conformi',t],['Sanificazioni registrate',s],['Merce in ingresso controllata',tr],['Attestati HACCP validi',fo]];
}

}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error('load'))};document.head.appendChild(s)})}
function prepImage(file,max=2000,gray=false){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();

const IDB=(()=>{let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('haccp-salus-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>{dbp=null;rej(r.error)}}catch(e){dbp=null;rej(e)}}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('f',mode);const q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return {put:(k,v)=>tx('readwrite',s=>s.put(v,k)),get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k))};
})();

  let marca='';const low=T.toLowerCase();

  if(!marca){const l=lines.find(x=>/^[A-Z][A-Z0-9 &.\-]{2,24}$/.test(x)&&!/(made in|volt|hz|watt|serial|model|type|tipo|matr|refriger|gas|r\d{3}|class|ip\d)/i.test(x));if(l)marca=l}
  return {marca,modello,matricola,sigla:codice};
}
async function readPlate(file,cur){
  const id=ui.readId=(ui.readId||0)+1;
  const step=msg=>{if(id!==ui.readId)return;const p=$('#rd-p');if(p)p.textContent=msg};
  openSheet('Lettura della targhetta',`<div class="loading"><span class="spin" aria-hidden="true"></span><p id="rd-p" role="status">Preparo la foto…</p><button class="btn sm ghost" data-act="rd-stop">Annulla</button></div>`);
  let out=null,src='manual';
  try{
    const big=await prepImage(file,1600);
    if(window.claude){try{step('Claude sta leggendo la targhetta…');const d=await aiJSON(big,`Leggi la foto della targhetta di un'attrezzatura professionale da cucina o pasticceria (frigorifero, cella, forno, abbattitore...). Rispondi SOLO con un oggetto JSON: {"marca":"...","modello":"...","matricola":"...","codice":"..."}. "matricola" è il numero di serie (S/N, Serial, Matr.). "codice" è un codice articolo se presente. Usa null per i dati non leggibili e non inventare nulla.`);out={marca:d.marca||'',modello:d.modello||'',matricola:d.matricola||'',sigla:d.codice||''};src='ai'}catch(e){if(e&&e.code==='cancelled')return}}
    if(id!==ui.readId)return;
    if(!out){step('Leggo il testo della targhetta…');const raw=await ocrRead(await prepImage(file,2000,true),m=>{if(m&&m.status==='recognizing text')step(`Leggo il testo… ${Math.round((m.progress||0)*100)}%`);else if(m&&/load|initializ/i.test(m.status||''))step('Preparo il lettore di testo (la prima volta serve qualche secondo)…')});if(id!==ui.readId)return;out=parsePlate(raw);src='ocr'}
  }catch(e){if(id!==ui.readId)return;out=null;src='manual'}
  if(id!==ui.readId)return;
  const pre={...cur,_src:src};
  if(out)Object.keys(out).forEach(k=>{const v=out[k];if(v&&String(v).trim()&&String(v)!=='null')pre[k]=String(v).trim()});
  attrForm(ui.attrEdit||null,pre);
}

/* cancellazione automatica: lotti e DDT più vecchi di S.retention anni (un lotto resta se un DDT conservato lo usa) */
function purgeOld(dry){
  const y=S.retention||1;const c=new Date(TODAY);c.setFullYear(c.getFullYear()-y);const cut=isoOf(c);
  const keepU=S.uscite.filter(u=>u.date>=cut);
  const used=new Set(keepU.flatMap(u=>u.righe.map(r=>r.lot)));
  const keepL=S.lotti.filter(l=>l.date>=cut||used.has(l.id));
  const n=(S.uscite.length-keepU.length)+(S.lotti.length-keepL.length);
  if(!dry&&n){S.uscite=keepU;S.lotti=keepL;S.purge={date:TISO,n,cut};save()}
  return {n,cut};
}

/* unione a tre vie: due dispositivi che salvano insieme non si cancellano a vicenda */
function merge3(b,l,r){
  const sl=J(l),sr=J(r),sb=J(b);
  if(sl===sb)return r;if(sr===sb||sl===sr)return l;
  const isIdArr=x=>Array.isArray(x)&&x.every(y=>y&&typeof y==='object'&&y.id!=null);
  if(isIdArr(l)&&isIdArr(r)){
    const ba=Array.isArray(b)?b:[];const bm=new Map(ba.filter(x=>x&&x.id!=null).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x]));
    const out=[],seen=new Set();
    for(const x of [...l,...r]){const id=x.id;if(seen.has(id))continue;seen.add(id);
      const bx=bm.get(id),lx=lm.get(id),rx=rm.get(id);
      if(bx!==undefined){
        if(!lx){if(rx&&J(rx)!==J(bx))out.push(rx);continue}
        if(!rx){if(J(lx)!==J(bx))out.push(lx);continue}
        out.push(merge3(bx,lx,rx));
      }else out.push(lx||rx);
    }
    return out;
  }
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(obj(l)&&obj(r)){
    const bo=obj(b)?b:{};const o={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
      const inL=k in l,inR=k in r,inB=k in bo;
      if(!inL){if(inB&&J(bo[k])===J(r[k]))continue;o[k]=r[k];continue}
      if(!inR){if(inB&&J(bo[k])===J(l[k]))continue;o[k]=l[k];continue}
      o[k]=merge3(inB?bo[k]:(Array.isArray(l[k])?[]:obj(l[k])?{}:undefined),l[k],r[k]);
    }
    return o;
  }
  return l;
}

/* invio al server: carica le foto nuove, poi salva i dati con controllo di versione.
   Se un altro dispositivo ha salvato prima (risposta -1), scarica, unisce (merge3) e riprova. */
async function cloudPush(){
  if(!C.ready)return;
  if(C.saving){C.again=true;return}
  C.saving=true;clearTimeout(C.timer);
  try{
    for(let n=0;n<5;n++){
      C.dirty=false;
      const ext=extOf(S);const t=J(ext);
      await uploadPend();
      const {data:v,error}=await C.sb.rpc('salva_stato',{p_data:ext,p_version:C.ver});
      if(error)throw error;
      if(v>0){C.ver=v;C.base=t;lsSet(CKEY+'-b',t);if(!C.dirty)lsSet(CKEY,t);metaSet({...metaGet(),ver:v,dirty:C.dirty});C.err=0;break}
      const rem=await fetchState();if(!rem)throw new Error('stato');
      const merged=merge3(C.base?JSON.parse(C.base):{},extOf(S),rem.data);
      C.ver=rem.version;C.base=J(rem.data);
      await fetchRefs(refsIn(merged));
      S=swapIn(merged);C.dirty=true;
      if($('#sheet').hidden&&ui.view!=='login')rerender();else C.needRender=true;
    }
  }catch(e){
    C.dirty=true;C.err++;
    const m=String((e&&e.message)||e||'');
    if(/abbonamento non attivo/i.test(m)){C.block='sospesa';route()}
    else if(/pagamento richiesto/i.test(m)){C.block='pagamento';route()}
    else{if(C.err===1)toast('Non riesco a salvare online: riprovo da solo appena torna la connessione');clearTimeout(C.timer);C.timer=setTimeout(cloudPush,Math.min(60000,3000*C.err))}
  }finally{
    C.saving=false;
    if(C.again&&!C.err){C.again=false;C.dirty=true}
    if(C.dirty&&!C.err){clearTimeout(C.timer);C.timer=setTimeout(cloudPush,400)}
  }
}

    const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images)throw {code:'unavailable'};
    return labelNorm(await sample.json(labelPromptC(),{images:[blob]}));
  }
  if(!CLOUD||!C.sb)throw {code:'unavailable'};
  const {data}=await C.sb.auth.getSession();const s=data&&data.session;if(!s)throw {code:'unavailable'};
  let r;try{r=await fetch(SUPA.url+'/functions/v1/leggi-fattura',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+s.access_token,apikey:SUPA.key},
    body:JSON.stringify({tipo:'etichetta',image:await blobB64(blob),type:blob.type||'image/jpeg'})})}catch(e){throw {code:'network'}}
  const j=await r.json().catch(()=>null);

/* codici GS1 (cartoni dei grossisti): (01) prodotto, (10) lotto, (17) scadenza, (15) TMC, (310n) peso */
function parseCode(raw){
  const G=String.fromCharCode(29);
  let s=String(raw||'').trim().replace(/^\][A-Za-z]\d/,'');
  const o={raw:s};
  const e=eanOk(s);if(e&&/^\d+$/.test(s)){o.ean=e;return o}
  s=s.replace(/\((\d{2,4})\)/g,(m,a)=>G+a).replace(new RegExp('^'+G),'');
  const FIX={'00':18,'01':14,'02':14,'11':6,'13':6,'15':6,'17':6,'20':2};let p=0,ok=false;
  const dt=v=>{const y=2000+ +v.slice(0,2),m=v.slice(2,4);let d=v.slice(4,6);if(d==='00')d=String(new Date(y,+m,0).getDate()).padStart(2,'0');return /^\d{2}$/.test(m)&&+m>=1&&+m<=12?`${y}-${m}-${d}`:''};
  while(p<s.length){
    if(s[p]===G){p++;continue}
    const ai=s.slice(p,p+2),ai4=s.slice(p,p+4);
    if(FIX[ai]){const v=s.slice(p+2,p+2+FIX[ai]);p+=2+FIX[ai];ok=true;
      if(ai==='01'||ai==='02')o.ean=eanOk(v);
      if(ai==='17')o.scad=dt(v);if(ai==='15'&&!o.scad)o.scad=dt(v)}
    else if(ai==='10'||ai==='21'){let q=s.indexOf(G,p+2);if(q<0)q=s.length;if(ai==='10')o.lotto=s.slice(p+2,q).slice(0,20);p=q;ok=true}
    else if(/^310\d$/.test(ai4)){o.kg=+s.slice(p+4,p+10)/Math.pow(10,+ai4[3]);p+=10;ok=true}
    else if(/^3\d{3}$/.test(ai4)){p+=10;ok=true}
    else break;
  }
  return ok?o:{raw:o.raw};
}
/* decodifica sul telefono: BarcodeDetector del browser se c'è (Android), altrimenti ZXing in più angolazioni */
async function readBarcode(file){
  try{if('BarcodeDetector' in window){const bd=new window.BarcodeDetector();const bmp=await createImageBitmap(file);const r=await bd.detect(bmp);if(r&&r.length)return r[0].rawValue}}catch(e){}
  try{if(!window.ZXing)await loadScript(ZXJS)}catch(e){return ''}
  const Z=window.ZXing;if(!Z||!Z.MultiFormatReader)return '';
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const F=Z.BarcodeFormat;const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.ITF,F.DATA_MATRIX,F.QR_CODE]);
    const rd=new Z.MultiFormatReader();rd.setHints(hints);
    const tries=[[1400,0],[1400,90],[1400,8],[1400,-8],[2200,0],[1400,16],[1400,-16],[900,0],[2200,90]];
    for(const [max,deg] of tries){
      const sc=Math.min(1,max/Math.max(img.width,img.height));const w=img.width*sc,h=img.height*sc;const r=deg*Math.PI/180;
      const bw=Math.abs(w*Math.cos(r))+Math.abs(h*Math.sin(r)),bh=Math.abs(w*Math.sin(r))+Math.abs(h*Math.cos(r));const m=Math.round(Math.max(bw,bh)*0.06);
      const c=document.createElement('canvas');c.width=Math.round(bw+2*m);c.height=Math.round(bh+2*m);const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.translate(c.width/2,c.height/2);x.rotate(r);x.drawImage(img,-w/2,-h/2,w,h);
      try{const res=rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))));if(res&&res.getText())return res.getText()}catch(e){}
    }
  }catch(e){}finally{URL.revokeObjectURL(url)}
  return '';
}

/* cerca in magazzino: prima per lotto, poi per EAN, poi per nome; a parità sceglie la scadenza più vicina */
function stockMatch(d){
  const P=S.products;if(!P.length)return null;
  const fifo=a=>[...a].sort((x,y)=>String(x.scad||'9999').localeCompare(String(y.scad||'9999')))[0];
  if(d.lotto){const L=normL(d.lotto);const x=P.filter(p=>normL(p.lotto)===L);if(x.length)return fifo(x)}
  if(d.ean){const x=P.filter(p=>p.ean===d.ean);if(x.length)return fifo(x)}
  if(d.name){const dt=new Set(normTxt(d.name).split(' ').filter(w=>w.length>2));
    if(dt.size){let best=[],bs=0;for(const p of P){const w=normTxt(p.name).split(' ').filter(x=>x.length>2);if(!w.length)continue;const s=w.filter(x=>dt.has(x)).length/w.length;if(s>bs){bs=s;best=[p]}else if(s===bs&&s>0)best.push(p)}
      if(bs>=0.6)return fifo(best)}}
  return null;
}

/* ---------- rintracciabilità di un lotto di materia prima (richiamo) ----------
   Dal lotto del fornitore (es. il lotto della farina scritto in fattura) si risale a:
   1. da dove è arrivato: fattura, fornitore, data, quantità, scadenza (S.fatture, S.products);
   2. in quali lotti di produzione è stato usato (S.lotti[].items[].lotto);
   3. a quali clienti sono stati consegnati quei lotti, con quale DDT (S.uscite).
   Si può cercare anche il codice di un lotto di produzione. Il risultato si scarica in PDF,
   pronto per un ritiro/richiamo (Reg. CE 178/2002 artt. 18-19). */
const lotKey=s=>String(s||'').toUpperCase().replace(/[\s.\-\/]/g,'');
function traceLots(){
  const set=new Map();const add=(v,t)=>{const k=lotKey(v);if(k&&!set.has(k))set.set(k,{v:String(v).trim(),t})};
  S.fatture.forEach(f=>(f.items||[]).forEach(i=>add(i.lotto,i.name)));
  S.products.forEach(p=>add(p.lotto,p.name));
  S.lotti.forEach(l=>(l.items||[]).forEach(i=>add(i.lotto,i.name)));
  S.lotti.forEach(l=>add(l.code,l.name+' (lotto di produzione)'));
  return [...set.values()];
}
function traceRun(q){
  const k=lotKey(q);if(!k)return null;
  const hit=v=>lotKey(v)===k;
  const orig=[];
  S.fatture.forEach(f=>(f.items||[]).forEach(i=>{if(hit(i.lotto))orig.push({name:i.name,forn:fname(f.forn),fatt:f.num,date:f.date,qty:i.qty,kg:i.kg,scad:i.scad})}));
  S.products.forEach(p=>{if(hit(p.lotto)&&!orig.some(o=>o.name===p.name))orig.push({name:p.name,forn:fname(p.forn)||p.marca||'',fatt:p.fatt||'',date:'',qty:p.qty,kg:p.kg,scad:p.scad,mag:true})});
  const direct=S.lotti.filter(l=>hit(l.code));
  const used=S.lotti.filter(l=>(l.items||[]).some(i=>hit(i.lotto)));
  if(!orig.length)used.forEach(l=>(l.items||[]).filter(i=>hit(i.lotto)).forEach(i=>{if(!orig.some(o=>o.name===i.name))orig.push({name:i.name,forn:i.marca||'',fatt:'',date:'',qty:'',kg:'',scad:''})}));
  const lots=[...new Map([...used,...direct].map(l=>[l.id,l])).values()].sort((a,b)=>a.date.localeCompare(b.date));
  const ids=new Set(lots.map(l=>l.id));
  const ddt=[];
  S.uscite.forEach(u=>u.righe.forEach(r=>{if(ids.has(r.lot)){const c=clOf(u.cliente),l=lotOf(r.lot);ddt.push({cliente:c.name,tipo:c.tipo||'',addr:c.addr||'',ddt:u.ddt,date:u.date,lot:l.code,prod:l.name,qty:r.qty})}}));
  ddt.sort((a,b)=>a.cliente.localeCompare(b.cliente,'it')||a.date.localeCompare(b.date));
  const clienti=[...new Map(ddt.map(d=>[d.cliente+'|'+d.addr,{name:d.cliente,tipo:d.tipo,addr:d.addr,righe:ddt.filter(x=>x.cliente===d.cliente&&x.addr===d.addr)}])).values()];
  const shipped=new Set(ddt.map(d=>d.lot));
  const canon=traceLots().find(x=>lotKey(x.v)===k);
  return {q:canon?canon.v:String(q).trim(),orig,lots,direct:direct.length>0,ddt,clienti,fermi:lots.filter(l=>!shipped.has(l.code))};
}
const ddtN=s=>/^ddt/i.test(String(s||''))?String(s):'DDT '+s;
const qtyTxt=o=>[o.qty!==''&&o.qty!=null?`${o.qty} conf.`:'',o.kg?`${String(o.kg).replace('.',',')} kg`:''].filter(Boolean).join(' × ');
function traceSheet(q){
  const sugg=traceLots();
  const r=q?traceRun(q):null;
  let res='';
  if(r){
    const none=!r.orig.length&&!r.lots.length;
    res=none?`<div class="card"><p>Nessun risultato per il lotto <b class="mono">${esc(r.q)}</b>. Controlla come è scritto in fattura o scegli un lotto dall'elenco.</p></div>`:`
    <div class="card stack" style="gap:6px"><span class="lbl">In breve</span><p>Il lotto <b class="mono">${esc(r.q)}</b> ${r.direct?'':`è stato usato in <b>${r.lots.length} lott${r.lots.length===1?'o':'i'} di produzione</b>`}${r.direct?`è un lotto di produzione`:''}${r.clienti.length?`, consegnat${r.lots.length===1?'o':'i'} a <b>${r.clienti.length} client${r.clienti.length===1?'e':'i'}</b> con ${r.ddt.length} DDT`:', non ancora consegnato a nessun cliente'}.</p></div>
    ${r.orig.length?`<div class="stack" style="gap:8px"><span class="lbl">1. Materia prima</span>${r.orig.map(o=>`<div class="card stack" style="gap:3px"><strong>${esc(o.name)}</strong><span class="r-sub">${esc(o.forn||'Fornitore non indicato')}${o.fatt?` · fattura N° <span class="mono">${esc(o.fatt)}</span>`:''}${o.date?` del ${fmt(o.date)}`:''}</span><span class="r-sub">${esc(qtyTxt(o)||'')}${o.scad?` · scadenza ${fmt(o.scad)}`:''}${o.mag?' · in magazzino':''}</span></div>`).join('')}</div>`:''}
    <div class="stack" style="gap:8px"><span class="lbl">2. Lotti di produzione (${r.lots.length})</span>${r.lots.length?r.lots.map(l=>`<div class="card stack" style="gap:3px"><strong>${esc(l.name)}</strong><span class="r-sub">Lotto <span class="mono">${esc(l.code)}</span> · prodotto il ${fmt(l.date)}${l.scad?` · scad. ${fmt(l.scad)}`:''}</span></div>`).join(''):'<p class="hint">Non è stato usato in nessun lotto di produzione.</p>'}</div>
    <div class="stack" style="gap:8px"><span class="lbl">3. Clienti a cui è arrivato (${r.clienti.length})</span>${r.clienti.length?r.clienti.map(c=>`<div class="card stack" style="gap:4px"><strong>${esc(c.name)}</strong><span class="r-sub">${esc([c.tipo,c.addr].filter(Boolean).join(' · ')||'Indirizzo non indicato')}</span>${c.righe.map(d=>`<span class="r-sub"><span class="mono">${esc(ddtN(d.ddt))}</span> del ${fmt(d.date)} · ${esc(d.prod)} lotto <span class="mono">${esc(d.lot)}</span> · q.tà ${esc(d.qty)}</span>`).join('')}</div>`).join(''):'<p class="hint">Nessun DDT con questi lotti.</p>'}</div>
    ${r.fermi.length&&r.clienti.length?`<div class="stack" style="gap:6px"><span class="lbl">Lotti non ancora consegnati</span><p class="r-sub">${r.fermi.map(l=>`${esc(l.name)} <span class="mono">${esc(l.code)}</span>`).join(' · ')}</p></div>`:''}
    <button class="btn block" type="button" data-act="trace-pdf">${ic('file',18)} Scarica il rapporto PDF</button>`;
  }
  openSheet('Rintraccia un lotto',`<div class="stack">
    <p class="muted">Scrivi il lotto della materia prima, come è scritto in fattura o sull'etichetta del fornitore. Vedi in quali lotti di produzione è stato usato e a quali clienti è arrivato.</p>
    <form data-form="trace" class="stack" novalidate><div class="row-in" style="display:flex;gap:8px"><input class="in" id="tr-q" name="q" list="tr-list" value="${esc(q||'')}" placeholder="es. L2610-087" autocomplete="off" aria-label="Lotto da rintracciare" style="flex:1;min-width:0"><button class="btn" type="submit">Cerca</button></div>
    <datalist id="tr-list">${sugg.map(s=>`<option value="${esc(s.v)}">${esc(s.t)}</option>`).join('')}</datalist>${errP}</form>
    ${res}</div>`);
  ui.traceQ=q||'';ui.sheetRefresh=()=>traceSheet(ui.traceQ);
}

/* ---------- scarico del magazzino da ricetta (Crea lotto) ----------
   Con una ricetta (grammi per una ricetta) e la quantità prodotta (es. "8 pezzi" = 8 volte la
   ricetta), ogni ingrediente viene moltiplicato e scalato dal magazzino. Il magazzino conta le
   confezioni (p.qty) da p.kg kg ciascuna: lo scarico toglie kg/p.kg confezioni, anche frazionarie
   (es. 2,4 confezioni). Lo scarico resta scritto nel lotto (l.scarico[]) e si può annullare. */
const qN=v=>Math.round(v*10000)/10000;   /* confezioni salvate con 4 decimali (precisione di grammi anche sui sacchi da 25 kg) */
const qTxt=v=>String(Math.round((+v||0)*100)/100).replace('.',',');
const kgTxt=v=>String(Math.round((+v||0)*100)/100).replace('.',',')+' kg';
const gTxt=g=>g>=1000?`${String(qN(g/1000)).replace('.',',')} kg`:`${qN(g)} g`;
function lotMult(qty){const n=num(String(qty||'').replace(/^[^\d]*/,''));return n&&n>0?n:null}
function scaricoPlan(r,mult,selIds){
  if(!r||!mult)return [];
  const sel=[...selIds].map(id=>S.products.find(p=>p.id===id)).filter(Boolean);
  return r.ingr.map(([n,g])=>{const k=String(n).toLowerCase();
    const p=sel.find(x=>x.name.toLowerCase()===k)||sel.find(x=>x.name.toLowerCase().startsWith(k)||k.startsWith(x.name.toLowerCase()));
    const tot=(+g||0)*mult;
    if(!p)return {name:n,g:+g||0,tot,miss:true};
    const kg=+p.kg||0;if(!kg)return {name:n,g:+g||0,tot,p,nokg:true};
    const conf=tot/1000/kg;return {name:n,g:+g||0,tot,p,conf,after:qN((+p.qty||0)-conf)};
  });
}
function scaricoHTML(){
  const r=S.ricette.find(x=>x.id===ui.lotRic);if(!r)return '';
  const q=$('#lf-q'),mult=lotMult(q?q.value:'');
  if(!mult)return `<p class="hint">Scrivi la quantità prodotta: gli ingredienti della ricetta ${esc(r.name)} vengono moltiplicati per quel numero e scalati dal magazzino.</p>`;
  const plan=scaricoPlan(r,mult,ui.sel);
  return `<span class="lbl">Ingredienti × ${qTxt(mult)}</span><div class="ilist">${plan.map(x=>`<div class="ili"><span><strong>${esc(x.name)}</strong><br><span class="r-sub">${gTxt(x.g)} × ${qTxt(mult)} = <b>${gTxt(x.tot)}</b></span></span><span class="r-sub" style="text-align:right">${x.miss?tag('warn','Non in magazzino'):x.nokg?tag('warn','Peso confezione mancante'):`−${qTxt(x.conf)} conf. da ${qTxt(x.p.kg)} kg<br>restano ${x.after<0?`<b style="color:var(--bad)">${qTxt(x.after)}</b>`:`${qTxt(x.after)} (${kgTxt(x.after*x.p.kg)})`}`}</span></div>`).join('')}</div>${plan.some(x=>x.after<0)?`<p class="hint" style="color:var(--bad)">In magazzino non c'è abbastanza: lo scarico porta a zero e conviene controllare le quantità.</p>`:''}`;
}
const _lotForm=lotForm;
lotForm=function(){

  const fl=q.closest('.field');
  fl.insertAdjacentHTML('afterend',`<label class="cbox"><input type="checkbox" name="scarico" checked><span>Scala gli ingredienti dal magazzino</span></label><div id="lf-sc" class="stack" style="gap:6px">${scaricoHTML()}</div>`);
};
document.addEventListener('input',e=>{if(e.target.id==='lf-q'){const d=$('#lf-sc');if(d)d.innerHTML=scaricoHTML()}});

const _lotSubmit=FORMS.lot;
FORMS.lot=f=>{
  const r=S.ricette.find(x=>x.id===ui.lotRic),doIt=!!(f.elements.scarico&&f.elements.scarico.checked);
  const plan=r&&doIt?scaricoPlan(r,lotMult(val(f,'qty')),ui.sel):[];
  const n0=S.lotti.length;_lotSubmit(f);
  if(S.lotti.length===n0||!plan.length)return;
  const l=S.lotti[S.lotti.length-1];const done=[];
  plan.filter(x=>x.p&&x.conf).forEach(x=>{const p=S.products.find(y=>y.id===x.p.id);if(!p)return;const tolto=Math.min(+p.qty||0,x.conf);p.qty=qN((+p.qty||0)-tolto);done.push({pid:p.id,name:p.name,lotto:p.lotto,g:x.tot,conf:qN(tolto),manca:qN(x.conf-tolto)})});
  if(!done.length)return;
  l.scarico=done;l.mult=lotMult(l.qty);save();rerender();
  setTimeout(()=>{const d=document.getElementById('d-l-'+l.id);if(d)d.open=true},40);
  const short=done.filter(d=>d.manca>0);
  toast(`Lotto ${l.code} creato · scalati ${done.length} ingredient${done.length===1?'e':'i'} dal magazzino${short.length?` (${short.length} non bastavano)`:''}`);
};

  const undo=l.scaricoAnn?'':`<button class="btn sm ghost" data-act="lot-unload" data-id="${l.id}">${ic('refresh',16)} Annulla scarico</button>`;
  return h.replace('<div class="actions">',box+'<div class="actions">'+undo);
};

/* ---------- abbonamento con Stripe (solo online) ----------
   Ogni azienda cliente paga LabService dall'app. LabService decide nell'Area LabService:
   pagamento "stripe" (il cliente paga con carta) o "esente" (gestito da LabService fuori dall'app),
   piano mensile o annuale e prezzo. Il cliente attiva l'abbonamento con 7 giorni di prova (carta subito,
   addebito automatico dopo la prova). Se un pagamento non riesce: avviso e 3 giorni di tolleranza, poi blocco.
   I dati della carta restano su Stripe: l'app vede solo lo stato. Server: funzione "pagamenti". */
const eur=c=>(Math.round(c||0)/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const perTxt=p=>p==='annuale'?'all\'anno':'al mese';
const dIso=t=>t?String(t).slice(0,10):'';
const gratiaFine=a=>a&&a.insoluto_dal?new Date(Date.parse(a.insoluto_dal)+3*864e5).toISOString().slice(0,10):'';
async function payCall(azione,body={}){
  const {data}=await C.sb.auth.getSession();const s=data&&data.session;
  let r;try{r=await fetch(SUPA.url+'/functions/v1/pagamenti',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+(s?s.access_token:''),apikey:SUPA.key},body:J({azione,...body})})}
  catch(e){throw new Error('Connessione non riuscita: riprova')}
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j||j.error)throw new Error((j&&j.error)||('Errore '+r.status));
  return j;
}
const payBack=()=>location.origin+location.pathname;
/* all'ingresso: se l'abbonamento non permette di lavorare, rilegge lo stato da Stripe (es. appena tornati
   dal pagamento) e, se serve, mostra la schermata di attivazione. Ritorna false se l'app va bloccata. */
async function payGate(ctx){
  const qs=new URLSearchParams(location.search),esito=qs.get('pagamento');
  if(esito){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}
  const a=ctx.azienda;
  if((!ctx.abbonamento_ok||esito==='ok')&&a.pagamento==='stripe'){
    try{const r=await payCall('stato');if(r&&r.abbonamento){Object.assign(a,r.abbonamento);ctx.abbonamento_ok=r.abbonamento.ok}}catch(e){}
  }
  if(esito==='ok'&&ctx.abbonamento_ok)setTimeout(()=>toast(a.sub_stato==='trialing'?`Abbonamento attivato: prova gratuita fino al ${fmt(dIso(a.prova_fine))}`:'Pagamento registrato: grazie!'),300);
  if(ctx.abbonamento_ok===false){C.block='pagamento';route();return false}
  return true;
}
function payHTML(){
  const a=(C.ctx&&C.ctx.azienda)||{},nome=esc(a.nome||'la tua azienda');
  const head=`<main class="login pad stack"><div class="logo" role="img" aria-label="LabService srls"><b>Lab</b>Service <small>srls</small></div><div class="card stack">`;
  const foot=`<p class="hint">Pagamento sicuro con Stripe: i dati della carta non passano dall'app né da LabService.</p></div><button class="btn sec" data-act="logout">Esci</button></main>`;
  const prezzo=a.prezzo_cent?`<div class="card stack" style="gap:4px;background:var(--brand-soft);border-color:var(--brand)"><span class="lbl">Il tuo piano</span><strong style="font-size:1.25em">${eur(a.prezzo_cent)} ${perTxt(a.piano)}</strong><span class="r-sub">Abbonamento ${a.piano==='annuale'?'annuale':'mensile'} · IVA inclusa · disdici quando vuoi</span></div>`:'';
  if(!a.prezzo_cent||!a.piano)return head+`<strong>Abbonamento da impostare</strong><p>LabService non ha ancora impostato il piano di <b>${nome}</b>. Contattali per attivare l'accesso.</p>`+foot;
  if(['past_due','unpaid'].includes(a.sub_stato))return head+`<strong>Pagamento non riuscito</strong><p>L'ultimo addebito per <b>${nome}</b> non è andato a buon fine e i 3 giorni di tolleranza sono passati. Aggiorna la carta per tornare a lavorare: i tuoi dati sono al sicuro.</p>${prezzo}<button class="btn" data-act="pay-portal">Aggiorna il metodo di pagamento</button><button class="btn ghost" data-act="pay-recheck">Ho già pagato: ricontrolla</button>`+foot;
  if(a.prova_usata||a.sub_stato)return head+`<strong>Abbonamento terminato</strong><p>L'abbonamento di <b>${nome}</b> non è attivo. Riattivalo per continuare a registrare: i dati salvati sono tutti lì.</p>${prezzo}<button class="btn" data-act="pay-checkout">Riattiva l'abbonamento</button><button class="btn ghost" data-act="pay-recheck">Ho già pagato: ricontrolla</button>`+foot;
  return head+`<strong>Attiva HACCP Salus</strong><p>Benvenuto! Per iniziare a usare l'app con <b>${nome}</b> attiva l'abbonamento.</p>${prezzo}
    <ul class="stack" style="gap:4px;padding-left:18px;margin:0"><li><b>7 giorni gratis.</b> Inserisci la carta ora: il primo addebito parte il <b>${fmt(addDays(7))}</b>.</li><li>Se disdici prima, non paghi nulla.</li><li>Ricevute e fatture le trovi nel tuo profilo.</li></ul>
    <button class="btn" data-act="pay-checkout">Inizia la prova gratuita</button>`+foot;
}
{const _bh=blockHTML;blockHTML=function(){return C.block==='pagamento'?payHTML():_bh()}}
/* scheda Abbonamento nel profilo */
const _subCardEsente=subCard;
subCard=function(){
  const a=(C.ctx&&C.ctx.azienda)||{};
  if(a.pagamento!=='stripe')return _subCardEsente();
  const st=a.sub_stato,t=st==='trialing'?tag('info','In prova'):st==='active'?tag('ok','Attivo'):['past_due','unpaid'].includes(st)?tag('bad','Pagamento non riuscito'):tag('warn','Non attivo');
  const next=st==='trialing'?kv('Primo addebito:',fmt(dIso(a.prova_fine))):st==='active'?kv('Prossimo rinnovo:',fmt(dIso(a.sub_fine_periodo))):['past_due','unpaid'].includes(st)?kv('Aggiorna la carta entro:',fmt(gratiaFine(a))):'';
  return `<div class="card stack"><div class="h-row"><strong>Abbonamento</strong>${t}</div>
    ${a.prezzo_cent?kv('Piano:',`${a.piano==='annuale'?'Annuale':'Mensile'} · ${eur(a.prezzo_cent)} ${perTxt(a.piano)}`):''}${next}
    <p class="muted">Carta, ricevute, fatture e disdetta si gestiscono sulla pagina sicura di Stripe.</p>
    ${a.stripe_customer||a.cliente?`<div><button class="btn sm" data-act="pay-portal">${ic('file',16)} Gestisci pagamento e fatture</button></div>`:''}</div>`;
};
/* in Home: avviso durante i 3 giorni di tolleranza */
{const _vh=V.home.r;V.home.r=()=>{const h=_vh();const a=C.ctx&&C.ctx.azienda;
  if(!CLOUD||!a||a.pagamento!=='stripe'||!['past_due','unpaid'].includes(a.sub_stato))return h;
  return `<div class="pad" style="padding-bottom:0"><div class="card stack" style="border-color:var(--bad)"><strong style="color:var(--bad)">Pagamento non riuscito</strong><p>L'ultimo addebito dell'abbonamento non è andato a buon fine. Aggiorna la carta entro il <b>${fmt(gratiaFine(a))}</b>, poi l'accesso si blocca.</p><div><button class="btn sm" data-act="pay-portal">Aggiorna il metodo di pagamento</button></div></div></div>`+h}}
/* Area LabService: stato del pagamento di ogni azienda */
function admSubLine(a){
  if(a.demo)return '';
  if(a.pagamento!=='stripe')return `<p class="r-sub">${tag('info','Pagamento gestito da LabService')}</p>`;
  const p=a.prezzo_cent?`${eur(a.prezzo_cent)} ${perTxt(a.piano)}`:'prezzo da impostare';
  const st=a.sub_stato;
  const t=!st?tag('warn','Da attivare dal cliente'):st==='trialing'?tag('info','In prova fino al '+fmt(dIso(a.prova_fine))):st==='active'?tag('ok','Pagante'):['past_due','unpaid'].includes(st)?tag('bad','Pagamento non riuscito'):st==='canceled'?tag('bad','Disdetto'):tag('warn',esc(st));
  return `<p class="r-sub" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${t}<span>Stripe · ${p}</span></p>`;
}
function admPayFields(a){
  a=a||{};const pg=a.id?(a.pagamento||'esente'):'stripe';
  return `<fieldset class="fs stack"><legend>Abbonamento</legend>
    <label class="cbox"><input type="radio" name="pagamento" value="stripe"${pg==='stripe'?' checked':''}><span>Il cliente paga con carta dall'app (Stripe)</span></label>
    <label class="cbox"><input type="radio" name="pagamento" value="esente"${pg==='esente'?' checked':''}><span>Pagamento gestito da LabService (nessun pagamento nell'app)</span></label>
    <div class="grid2">${fld('az-pi','Piano',sel('az-pi','piano',[['mensile','Mensile'],['annuale','Annuale']],a.piano||'mensile'))}${fld('az-pz','Prezzo (€, IVA inclusa)',inp('az-pz','prezzo',a.prezzo_cent?String(a.prezzo_cent/100).replace('.',','):'','inputmode="decimal" placeholder="es. 29,00" autocomplete="off"'))}</div>
    <p class="hint">Primo abbonamento: 7 giorni gratis con la carta inserita subito, poi l'addebito parte da solo. Se cambi il prezzo vale dal prossimo rinnovo; se passi da mensile ad annuale (o viceversa) il nuovo periodo parte subito.</p></fieldset>`;
}
{const _f=admAzForm;admAzForm=function(a){_f(a);const f=$('#sheet form[data-form="adm-az"]');if(!f)return;const b=f.querySelector('.errmsg')||f.querySelector('button[type=submit]');b.insertAdjacentHTML('beforebegin',admPayFields(a))}}
{const _s=FORMS['adm-az'];FORMS['adm-az']=async f=>{
  const pg=(f.querySelector('input[name=pagamento]:checked')||{}).value||'esente';
  const prezzo=val(f,'prezzo').replace(',','.'),piano=val(f,'piano');
  if(pg==='stripe'&&!(+prezzo>=1))return ferr(f,'Con il pagamento dall\'app indica il prezzo (almeno 1 €).',['prezzo']);
  const id=val(f,'id'),old=id?admAz(id):null;
  /* il form originale invia i dati anagrafici: qui aggiungo l'abbonamento alla stessa chiamata */
  const _call=admCall;admCall=(az,body={})=>_call(az,(az==='crea_azienda'||az==='modifica_azienda')?{...body,pagamento:pg,piano,prezzo}:body);
  try{await _s(f)}finally{admCall=_call}
  if(old&&pg==='stripe'&&(old.piano!==piano||Math.round(+prezzo*100)!==old.prezzo_cent)){   /* se c'è già un abbonamento Stripe, la funzione lo aggiorna */
    try{const r=await payCall('applica_prezzo',{azienda_id:id});if(r.applicato)toast('Nuovo prezzo applicato anche all\'abbonamento Stripe')}catch(e){toast('Prezzo salvato, ma Stripe non è stato aggiornato: '+e.message)}
  }
}}
/* Area LabService: verifica del collegamento con Stripe */
{const _va=vAdmin;vAdmin=function(){let h=_va();if(!ui.adm)return h;
  const card=`<div class="card stack"><div class="h-row"><strong>Pagamenti Stripe</strong><span id="pay-setup">${ui.paySetup||''}</span></div><p class="muted">Abbonamenti dei clienti con carta. Prezzo e piano si impostano in "Modifica dati" di ogni azienda.</p><div><button class="btn sm sec" data-act="pay-setup">Verifica collegamento</button></div></div>`;
  return h.replace('<div class="field"><label for="adm-q">',card+'<div class="field"><label for="adm-q">')};if(V.admin)V.admin.r=vAdmin}
Object.assign(ACT,{
  'pay-checkout':async a=>{a.disabled=true;const t=a.textContent;a.textContent='Apro la pagina di pagamento…';
    try{const r=await payCall('checkout',{ritorno:payBack()});location.href=r.url}catch(e){a.disabled=false;a.textContent=t;toast(e.message)}},
  'pay-portal':async a=>{if(a){a.disabled=true}
    try{const r=await payCall('portale',{ritorno:payBack()});location.href=r.url}catch(e){if(a)a.disabled=false;toast(e.message)}},
  'pay-recheck':()=>location.reload(),
  'pay-setup':async a=>{a.disabled=true;
    try{const r=await payCall('setup');
      ui.paySetup=r.configurato?tag(r.modalita==='live'?'ok':'warn',r.modalita==='live'?'Collegato · pagamenti reali':'Collegato · modalità di prova'):tag('bad','Chiave mancante');
      toast(r.configurato?`Stripe collegato: ${r.account} (${r.modalita==='live'?'pagamenti reali':'modalità di prova'})`:r.messaggio)}
    catch(e){ui.paySetup=tag('bad','Errore');toast(e.message)}
    a.disabled=false;const el=$('#pay-setup');if(el)el.innerHTML=ui.paySetup}
});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');
  if(!a||a.disabled)return;
  const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a,e)}
});
$('#scrim').addEventListener('click',()=>{closeSheet();closeDrawer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else closeDrawer()}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('err'))t.classList.remove('err');
  if(t.dataset.filter){const q=t.value.trim().toLowerCase();const list=document.getElementById(t.dataset.filter);if(!list)return;let vis=0;list.querySelectorAll('[data-q]').forEach(r=>{const h=!!q&&!r.dataset.q.includes(q);r.hidden=h;if(!h)vis++});const nq=list.querySelector('.noq');if(nq)nq.hidden=!(q&&vis===0)}
  if(t.dataset.bind)ui[t.dataset.bind]=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sel){t.checked?ui.sel.add(t.dataset.sel):ui.sel.delete(t.dataset.sel);const b=$('#lot-btn');if(b)b.textContent=`Crea lotto (${ui.sel.size})`}
  if(t.dataset.nc){const w=document.getElementById('ncw-'+t.dataset.nc);if(w)w.hidden=!t.checked}
  if(t.dataset.ch==='ric'){ui.lotName=($('#cl-name')||{}).value||ui.lotName;if(t.value)applyRicetta(t.value,false);else{ui.lotRic='';}rerender()}
  if(t.dataset.ch==='label'){ui.label=t.value;rerender()}
  if(t.dataset.tk){const f=t.form;const other=f.elements[(t.dataset.v==='ok'?'nc-':'ok-')+t.dataset.tk];if(t.checked&&other)other.checked=false;tempSync(f)}
  if(t.dataset.ch==='t-all'){const f=t.form;devices().forEach(d=>{f.elements['ok-'+d.id].checked=t.checked;if(t.checked)f.elements['nc-'+d.id].checked=false});tempSync(f)}
  if(t.dataset.tm){t.checked?ui.tsel.add(t.dataset.tm):ui.tsel.delete(t.dataset.tm);rerender()}
  if(t.dataset.ch==='tm-all'){ui.tsel=t.checked?new Set(tempKeys()):new Set();rerender()}
  if((t.id==='cam-lot'||t.id==='cam-lotfin')&&t.files&&t.files.length){
    const file=t.files[0];const mode=ui.camMode;
    if(t.id==='cam-lotfin'){
      shrink(file).then(img=>{ui.lotPhotos.push({img,cap:'Prodotto finito'});const w=document.getElementById('lf-photos');if(w)w.innerHTML=thumbs(ui.lotPhotos,'new');toast('Foto aggiunta al lotto')}).catch(()=>toast('Non riesco a leggere questa foto: riprova'));
      return;
    }
    scanLot(file,mode);
    return;
  }
  if(t.dataset.ch==='plan'){S.plan=t.value;save();toast(t.value==='annuo'?'Piano annuo selezionato: 150 € l\'anno':'Piano mensile selezionato: 15 € al mese')}
  if(t.dataset.ch==='fp-f'){const w=document.getElementById('fp-new');if(w)w.hidden=t.value!=='__new'}
  if(t.id==='cam-fatt'&&t.files&&t.files.length){readInvoice(t.files[0]);return}
  if(t.id==='cam-prod'&&t.files&&t.files.length){scanProd(t.files[0]);return}
});
window.addEventListener('hashchange',route);
if(CLOUD)cloudBoot();else route();
})();
